# ============================================================
#  CodeMagic CI/CD Configuration
#  Chatizy E2EE Mobile App — iOS Builds
#
#  Workflow: ios-device
#    → Development-signed IPA for real device testing
#    → Requires Apple Developer account ($99/year)
#    → Set up 'apple_credentials' env group in CodeMagic UI
# ============================================================

workflows:
  ios-device:
    name: iOS Device Build (Development Signed IPA)
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: apps/mobile
    environment:
      groups:
        - apple_credentials
        # ──────────────────────────────────────────────────────
        # Create this group in CodeMagic UI → Teams → Settings
        # → Environment variables, with these 3 variables:
        #
        #   APP_STORE_CONNECT_ISSUER_ID
        #     → App Store Connect → Users & Access → Integrations
        #       → App Store Connect API → Issuer ID (top of page)
        #
        #   APP_STORE_CONNECT_KEY_IDENTIFIER
        #     → The Key ID of your API key
        #
        #   APP_STORE_CONNECT_PRIVATE_KEY
        #     → Paste the full contents of the .p8 file
        #       (including -----BEGIN PRIVATE KEY----- lines)
        # ──────────────────────────────────────────────────────
      vars:
        BUNDLE_ID: "com.chatizy.app"
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
        - pattern: develop
      cancel_previous_builds: true
    scripts:
      - name: Flutter Doctor
        script: |
          flutter doctor -v

      - name: Fetch Dependencies
        script: |
          flutter pub get

      - name: Analyze Code
        script: |
          flutter analyze --no-fatal-infos || true

      - name: Initialize Keychain
        script: |
          keychain initialize

      - name: Fetch Development Signing Files
        script: |
          # This fetches/creates a DEVELOPMENT certificate and profile
          # (NOT App Store) — just for testing on real devices
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_DEVELOPMENT \
            --create

      - name: Add Certificates to Keychain
        script: |
          keychain add-certificates

      - name: Set Up Provisioning Profiles
        script: |
          xcode-project use-profiles

      - name: Build Signed IPA
        script: |
          flutter build ipa --debug \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      email:
        recipients:
          - ahmad@chatizy.app
        notify:
          success: true
          failure: true
