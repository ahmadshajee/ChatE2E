workflows:
  ios-unsigned:
    name: iOS Build (Unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: apps/mobile
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
    scripts:
      - name: Setup Flutter Tooling
        script: |
          flutter doctor
      - name: Fetch Flutter Dependencies
        script: |
          flutter pub get
      - name: Build iOS Archive (Unsigned)
        script: |
          flutter build ipa --debug --no-codesign
    artifacts:
      - build/ios/archive/*.xcarchive
      - build/ios/ipa/*.ipa

  ios-signed:
    name: iOS Build (Signed Release)
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: apps/mobile
    environment:
      groups:
        - app_store_credentials # Define this group in Codemagic UI for Apple API Keys/Certificates
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    scripts:
      - name: Fetch Flutter Dependencies
        script: |
          flutter pub get
      - name: Initialize Keychain
        script: |
          keychain initialize
      - name: Fetch iOS Certificates and Profiles
        script: |
          # Codemagic CLI will automatically fetch certificates using credentials group
          app-store-connect fetch-signing-files "com.chatizy.app" --project-type flutter
      - name: Add Certificates to Keychain
        script: |
          keychain add-certificates
      - name: Configure Provisioning Profiles
        script: |
          xcode-project use-profiles
      - name: Build Signed iOS IPA
        script: |
          flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
