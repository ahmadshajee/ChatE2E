# ============================================================
#  CodeMagic CI/CD Configuration
#  Chatizy E2EE Mobile App — iOS Unsigned Build
#
#  Produces an unsigned .app and .xcarchive for testing.
#  No Apple Developer account or certificates required.
# ============================================================

workflows:
  ios-build:
    name: iOS Build (Unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: apps/mobile
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
        - pattern: develop
        - pattern: 'feature/*'
      cancel_previous_builds: true
    scripts:
      - name: Flutter Doctor
        script: |
          flutter doctor -v

      - name: Fetch Dependencies
        script: |
          flutter pub get

      - name: Analyze Code
        script: |
          flutter analyze --no-fatal-infos || true

      - name: Build iOS (Unsigned, No Codesign)
        script: |
          flutter build ios --debug --no-codesign

    artifacts:
      - build/ios/iphoneos/*.app
      - flutter_drive.log

    publishing:
      email:
        recipients:
          - ahmad@chatizy.app
        notify:
          success: true
          failure: true
